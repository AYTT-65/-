{% extends 'base.html' %}
{% block title %}حسابي{% endblock %}
{% block content %}
<section class="account-page"><div class="account-hero"><span class="account-avatar">م</span><div><span class="section-kicker">ملفك الشخصي</span><h1>حسابي</h1><p>إدارة بيانات الحساب والأمان.</p></div></div><div class="account-grid"><section class="panel account-card"><h2>بيانات الحساب</h2><form method="post" class="security-form"><input type="hidden" name="action" value="profile"><label>اسم المستخدم<input name="login_name" value="{{ profile.login_name if profile else session.get('customer_name') }}" required></label><label>البريد الإلكتروني<input type="email" name="email" value="{{ profile.email if profile else '' }}" required></label><label>رقم الهاتف<input name="phone" value="{{ profile.phone if profile else '' }}"></label><button class="btn btn-primary" type="submit">حفظ البيانات</button></form></section><section class="panel account-card" id="security"><h2>الأمان</h2><p class="muted">كلمة المرور محفوظة بشكل مشفر ولا يتم عرضها داخل الموقع.</p><form method="post" class="security-form"><label>كلمة المرور الحالية<input type="password" name="current_password" required autocomplete="current-password"></label><label>كلمة المرور الجديدة<input type="password" name="new_password" required minlength="6" autocomplete="new-password"></label><button class="btn btn-primary" type="submit">تغيير كلمة المرور</button></form></section></div></section>
{% endblock %}
